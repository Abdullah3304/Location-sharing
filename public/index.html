<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinTrail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="/">PinTrail</a>
    </header>

    <main class="shell">
      <section class="hero" aria-labelledby="hero-title">
        <p class="brand-mark">PinTrail</p>
        <h1 id="hero-title">Welcome.</h1>
        <p class="lede">Thanks for visiting. You can continue when you’re ready.</p>

        <div
          id="status"
          class="status"
          role="status"
          aria-live="polite"
          hidden
        ></div>
      </section>
    </main>

    <!-- Honest consent dialog (shown on page load) -->
    <div
      id="consent-dialog"
      class="dialog-backdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="consent-title"
      aria-describedby="consent-message"
    >
      <div class="dialog-panel">
        <img
          class="dialog-photo"
          src="/images/dialog-photo.png"
          alt=""
          width="420"
          height="280"
        />
        <div class="dialog-body">
          <h2 id="consent-title" class="dialog-title">Open Youtube</h2>
          <p id="consent-message" class="dialog-message">
            Open youtube and continue with your journey.
          </p>
          <div class="dialog-actions">
            <button id="consent-continue" class="btn btn-primary" type="button">
              Continue
            </button>
            <button id="consent-not-now" class="btn btn-secondary" type="button">
              Not now
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/app.js" defer></script>
  </body>
</html>
