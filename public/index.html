<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinTrail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="/">PinTrail</a>
    </header>

    <main class="shell">
      <section class="hero" aria-labelledby="hero-title">
        <p class="brand-mark">PinTrail</p>
        <h1 id="hero-title">Welcome.</h1>
        <p class="lede">Please wait a moment…</p>

        <div
          id="status"
          class="status"
          role="status"
          aria-live="polite"
        >
          Loading…
        </div>
      </section>
    </main>

    <script src="/js/app.js" defer></script>
  </body>
</html>
