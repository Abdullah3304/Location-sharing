<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinTrail — Stored Locations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="/">PinTrail</a>
      <nav class="nav">
        <a class="nav-link" href="/">Share</a>
        <a class="nav-link is-active" href="/locations.html">View locations</a>
      </nav>
    </header>

    <main class="shell shell-wide">
      <section class="list-section" aria-labelledby="list-title">
        <div class="list-header">
          <div>
            <p class="eyebrow">Stored pins</p>
            <h1 id="list-title">Shared locations</h1>
            <p class="lede lede-compact">
              Every pin below was saved after a user granted geolocation permission.
            </p>
          </div>
          <button id="refresh-btn" class="btn btn-secondary" type="button">
            Refresh
          </button>
        </div>

        <div
          id="list-status"
          class="status"
          role="status"
          aria-live="polite"
        >
          Loading locations…
        </div>

        <div class="table-wrap">
          <table class="locations-table" aria-describedby="list-title">
            <thead>
              <tr>
                <th scope="col">Received</th>
                <th scope="col">Latitude</th>
                <th scope="col">Longitude</th>
                <th scope="col">Accuracy</th>
                <th scope="col">Device time</th>
                <th scope="col">Map</th>
              </tr>
            </thead>
            <tbody id="locations-body">
              <!-- Filled by locations.js -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p><a href="/">Share a new location</a></p>
    </footer>

    <script src="/js/locations.js" defer></script>
  </body>
</html>
